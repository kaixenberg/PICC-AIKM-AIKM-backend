name: Build & Deploy Docker Image

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: "3.13"

jobs:
  validate-and-test:
    name: Validate, Test & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements-api.txt
            requirements-dev.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev git

      - name: Upgrade pip & Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt -r requirements-dev.txt

      - name: Syntax & Compilation Validation
        run: python -m compileall src tests

      - name: Code Quality & Linting (Ruff)
        run: ruff check src tests --select=E,F,W --ignore=E501

      - name: Run Pytest Suite
        run: pytest
        env:
          CONFIG_SERVER_REQUIRED: "false"
          ALLOW_LOCAL_CONFIG_OVERRIDES: "true"

      - name: SAST Security Scan (Bandit)
        run: bandit -r src -ll -ii

      - name: Dependency Vulnerability Audit
        run: pip-audit --desc on -r requirements-api.txt || true

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py requirements requirements-api.txt -o bom.json

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: bom.json
          if-no-files-found: warn

  docker:
    name: Build & Push Docker Image
    needs: validate-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare lowercase image name for GHCR
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=PICC-AIKM-AIKM-backend
            org.opencontainers.image.description=AI Knowledge Management Backend Service for Nubo Native Platform
            org.opencontainers.image.vendor=Nubo-Native-Platform
            org.opencontainers.image.licenses=Apache-2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Print Image Digest
        run: echo "Docker image pushed with digest ${{ steps.docker_build.outputs.digest }}"
